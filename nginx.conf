# Ubuntu site configuration for Campus Köthen.
# Copy to /etc/nginx/sites-available/campus-koethen.sturahsa.de and enable it
# through /etc/nginx/sites-enabled/. The Docker container listens only on
# 127.0.0.1:8080, so it is not exposed directly to the internet.

server {
    listen 80;
    listen [::]:80;
    server_name campus-koethen.sturahsa.de;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://campus-koethen.sturahsa.de$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name campus-koethen.sturahsa.de;

    ssl_certificate /etc/letsencrypt/live/campus-koethen.sturahsa.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campus-koethen.sturahsa.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CampusKoethenTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;

    # The application container sends the same security headers. Replacing
    # them here avoids duplicates and also protects nginx error responses.
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'none'; font-src 'self'; form-action 'none'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'; upgrade-insecure-requests" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
